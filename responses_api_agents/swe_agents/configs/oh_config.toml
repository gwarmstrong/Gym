[llm.model]
# The following parameters are overridden by Nemo-Skills:
# model, base_url, temperature, top_p.
# Specifying them here will have no effect! Use Nemo-Skills options instead.
api_key = "EMPTY"  # pragma: allowlist secret
custom_llm_provider = "openai"
# native_tool_calling=true requires vLLM to be started with
# --enable-auto-tool-choice and --tool-call-parser=<model-specific parser>.
# NVIDIA-Nemotron-3-Nano ships only a reasoning parser, not a tool parser,
# so we disable native tool calling and let OpenHands parse tool calls
# from model text output instead. Re-enable once vLLM-side parser support
# is wired through.
native_tool_calling = false