config_paths:
  - resources_servers/ns_tools/configs/ns_tools.yaml
  - resources_servers/dsbench_da/configs/dsbench_da.yaml

ns_tools:
  resources_servers:
    ns_tools:
      verifiers:
        dsbench_da:
          type: resources_servers
          name: dsbench_da

dsbench_da_benchmark_agent:
  _inherit_from: ns_tools_simple_agent
  responses_api_agents:
    simple_agent:
      datasets:
      - name: dsbench_da
        type: benchmark
        jsonl_fpath: benchmarks/dsbench_da/data/dsbench_da_benchmark.jsonl
        prompt_config: benchmarks/dsbench_da/prompts/default.yaml
        prepare_script: benchmarks/dsbench_da/prepare.py
        license: MIT
