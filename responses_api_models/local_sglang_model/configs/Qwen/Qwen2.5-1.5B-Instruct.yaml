Qwen2.5-1.5B-Instruct:
  responses_api_models:
    local_sglang_model:
      entrypoint: app.py
      model: Qwen/Qwen2.5-1.5B-Instruct
      return_token_id_information: false
      uses_reasoning_parser: false
      replace_developer_role_with_system: true
      debug: false

      extra_body:
        temperature: 0.7
        top_p: 0.8
        max_output_tokens: null

      # If unset, defaults to ${cwd}/.cache/huggingface.
      hf_home: null

      sglang_serve_env_vars: {}

      # Forwarded to ``python -m sglang.launch_server`` as CLI flags.
      # Underscores are auto-translated to dashes (e.g. ``tp_size`` → ``--tp-size``).
      sglang_serve_kwargs:
        tp_size: 1
        pp_size: 1
        dp_size: 1
        mem_fraction_static: 0.7
        tool_call_parser: qwen
