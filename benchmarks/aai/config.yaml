config_paths:
  - benchmarks/mmlu_pro/config.yaml
  - benchmarks/hle/config.yaml
  - benchmarks/gpqa/config.yaml
  - benchmarks/aime25/config.yaml
  - benchmarks/livecodebench/v5_2407_2412/config.yaml
  - benchmarks/ifbench/config.yaml
  - benchmarks/aalcr/config.yaml

# Per-sub prompt overrides: replace each sub-benchmark's default prompt with the
# AAI-specific prompt from Skills' nemo_skills/prompt/config/eval/aai/.
# (mmlu_pro and gpqa AAI prompts already byte-match Gym's defaults, so no override.)
aime25_math_with_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      datasets:
      - name: aime25
        type: benchmark
        jsonl_fpath: benchmarks/aime25/data/aime25_benchmark.jsonl
        prompt_config: benchmarks/aai/prompts/math.yaml
        prepare_script: benchmarks/aime25/prepare.py
        num_repeats: 32

livecodebench_v5_2407_2412_code_gen_simple_agent:
  responses_api_agents:
    simple_agent:
      datasets:
      - name: livecodebench_v5_2407_2412
        type: benchmark
        jsonl_fpath: benchmarks/livecodebench/v5_2407_2412/data/livecodebench_v5_2407_2412_validation.jsonl
        prompt_config: benchmarks/aai/prompts/livecodebench.yaml
        prepare_script: benchmarks/livecodebench/v5_2407_2412/prepare.py
        num_repeats: 3
